<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geo Flyer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d1b2a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    touch-action: none;
  }
  h1 { margin-bottom: 8px; font-size: 1.4rem; }
  #game-wrap {
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border-radius: 8px;
    overflow: hidden;
    max-width: 100vw;
  }
  canvas {
    display: block;
    max-width: 100vw;
    max-height: 75vh;
    width: auto;
    height: auto;
  }
  #hud-top {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
    pointer-events: none;
  }
  .hud-badge {
    background: rgba(0, 0, 0, 0.55);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: bold;
    backdrop-filter: blur(4px);
  }
  #mute-btn {
    pointer-events: auto;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  #mute-btn:hover { background: rgba(0, 0, 0, 0.85); }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(0,0,0,0.55);
    padding: 20px;
    z-index: 10;
  }
  #overlay h2 { font-size: 1.6rem; margin-bottom: 8px; }
  #overlay p { font-size: 0.95rem; opacity: 0.9; margin-bottom: 16px; line-height: 1.5; }
  #overlay button {
    padding: 12px 32px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #f1c40f;
    color: #1e3c72;
    cursor: pointer;
  }
  #overlay button:hover { background: #f39c12; }
  #hint { margin-top: 8px; font-size: 0.85rem; opacity: 0.7; text-align: center; }
  #speed-bar-wrap {
    position: absolute;
    left: 14px;
    bottom: 14px;
    width: 100px;
    height: 10px;
    background: rgba(0,0,0,0.35);
    border-radius: 6px;
    overflow: hidden;
    z-index: 2;
  }
  #speed-bar {
    height: 100%;
    background: #f1c40f;
    width: 50%;
  }

  .touch-controls {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .touch-btn {
    pointer-events: auto;
    position: absolute;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: bold;
    user-select: none;
  }
  .btn-dir { width: 50px; height: 50px; left: 20px; }
  #btn-up { bottom: 80px; }
  #btn-down { bottom: 20px; }
  .btn-speed { width: 45px; height: 45px; right: 20px; }
  #btn-fast { bottom: 80px; }
  #btn-slow { bottom: 20px; }

  @media (pointer: coarse) {
    .touch-controls { display: block; }
  }
</style>
</head>
<body>

<h1>🌍 Geo Flyer</h1>

<div id="game-wrap">
  <div id="hud-top">
    <div class="hud-badge">🪙 Coins: <span id="coin-count">0</span></div>
    <button id="mute-btn">🔊 Audio: ON</button>
  </div>

  <canvas id="game" width="480" height="640"></canvas>
  <div id="speed-bar-wrap"><div id="speed-bar"></div></div>

  <div class="touch-controls">
    <div class="touch-btn btn-dir" id="btn-up">▲</div>
    <div class="touch-btn btn-dir" id="btn-down">▼</div>
    <div class="touch-btn btn-speed" id="btn-fast">+</div>
    <div class="touch-btn btn-speed" id="btn-slow">-</div>
  </div>

  <div id="overlay">
    <h2 id="overlay-title">Geo Flyer</h2>
    <p id="overlay-text">Your plane flies forward on its own.<br>
      Steer with <strong>↑/W</strong> or touch <strong>▲/▼</strong>.<br>
      Use <strong>A/D</strong> or <strong>+/-</strong> to adjust speed.<br>
      Collect 🪙 coins & enter a new country every <strong>12 points</strong>!</p>
    <button id="start-btn">Start Flying</button>
  </div>
</div>

<p id="hint">Desktop: WASD/Arrows · Mobile: On-screen buttons</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const VERTICAL_SPEED = 4;
const PIPE_WIDTH = 90;
const PIPE_GAP = 190;
const PIPE_SPACING = 260;

const MIN_SPEED = 1.5;
const MAX_SPEED = 7;
const DEFAULT_SPEED = 3;
const SPEED_ACCEL = 0.06;

const SAFE_START_DISTANCE = 400;

/* =========================================================
   COUNTRY THEMES & WEATHER TYPES
   ========================================================= */
const COUNTRIES = [
  {
    emoji: "🇨🇦", name: "Canada", weather: "snow",
    sky: ["#3a7bd5", "#73a5ff", "#bbd2c5"],
    base: "#2d3a2a", mid: "#505852", peak: "#a0aab2", snow: "#ffffff", tree: "#1d2e1c",
    hasSnow: true
  },
  {
    emoji: "🇹🇭", name: "Thailand", weather: "rain",
    sky: ["#00b4db", "#0083b0", "#a8e063"],
    base: "#1b4332", mid: "#2d6a4f", peak: "#52b788", snow: null, tree: "#081c15",
    hasSnow: false
  },
  {
    emoji: "🇪🇬", name: "Egypt", weather: "sand",
    sky: ["#f2994a", "#f2c94c", "#ffeb3b"],
    base: "#8d5b4c", mid: "#b07d62", peak: "#deab90", snow: null, tree: "#5c3d2e",
    hasSnow: false
  },
  {
    emoji: "🇯🇵", name: "Japan", weather: "snow",
    sky: ["#4a00e0", "#8e2de2", "#f8cdda"],
    base: "#2b2d42", mid: "#4a4e69", peak: "#8d99ae", snow: "#ffffff", tree: "#ffb703",
    hasSnow: true
  },
  {
    emoji: "🇦🇺", name: "Australia", weather: "rain",
    sky: ["#11998e", "#38ef7d", "#f45c43"],
    base: "#582f0e", mid: "#7f4f24", peak: "#936639", snow: null, tree: "#333d29",
    hasSnow: false
  }
];

let currentCountryIndex = 0;

/* =========================================================
   WEATHER PARTICLE SYSTEM
   ========================================================= */
class WeatherSystem {
  constructor() {
    this.particles = [];
    this.maxParticles = 70;
    this.init();
  }

  init() {
    this.particles = [];
    for (let i = 0; i < this.maxParticles; i++) {
      this.particles.push(this.createParticle(true));
    }
  }

  createParticle(randomY = false) {
    const weatherType = COUNTRIES[currentCountryIndex].weather;
    return {
      x: Math.random() * (W + 100) - 50,
      y: randomY ? Math.random() * H : -10,
      radius: Math.random() * 2.5 + 1,
      length: Math.random() * 14 + 8,
      speedY: weatherType === 'rain' ? Math.random() * 8 + 7 : Math.random() * 1.8 + 0.8,
      speedX: weatherType === 'rain' ? -2.5 : Math.random() * 0.5 - 0.25,
      swayOffset: Math.random() * Math.PI * 2,
      opacity: Math.random() * 0.6 + 0.3
    };
  }

  update(worldSpeed) {
    const weatherType = COUNTRIES[currentCountryIndex].weather;
    this.particles.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX - (worldSpeed * 0.3); // Responsive wind displacement

      if (weatherType === 'snow') {
        p.swayOffset += 0.02;
        p.x += Math.sin(p.swayOffset) * 0.4;
      }

      if (p.y > H || p.x < -60) {
        Object.assign(p, this.createParticle(false));
      }
    });
  }

  draw() {
    const weatherType = COUNTRIES[currentCountryIndex].weather;
    ctx.save();
    this.particles.forEach(p => {
      ctx.beginPath();
      if (weatherType === 'snow') {
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
        ctx.fill();
      } else if (weatherType === 'rain') {
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.speedX, p.y + p.length);
        ctx.strokeStyle = `rgba(180, 225, 255, ${p.opacity})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      } else if (weatherType === 'sand') {
        ctx.arc(p.x, p.y, p.radius * 0.8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(235, 180, 110, ${p.opacity * 0.8})`;
        ctx.fill();
      }
    });
    ctx.restore();
  }
}

const weatherSystem = new WeatherSystem();

/* =========================================================
   AUDIO SYSTEM (Web Audio API Synthesizer with Mute)
   ========================================================= */
let audioCtx = null;
let engineOsc = null;
let engineGain = null;
let isMuted = false;

const muteBtn = document.getElementById("mute-btn");
muteBtn.addEventListener("click", () => {
  isMuted = !isMuted;
  muteBtn.textContent = isMuted ? "🔇 Audio: OFF" : "🔊 Audio: ON";
  if (isMuted) {
    stopEngineSound();
  } else if (gameRunning) {
    startEngineSound();
  }
});

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function startEngineSound() {
  if (!audioCtx || isMuted) return;
  stopEngineSound();

  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();

  engineOsc.type = 'sawtooth';
  engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
  engineGain.gain.setValueAtTime(0.03, audioCtx.currentTime);

  engineOsc.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();
}

function updateEnginePitch(speed) {
  if (engineOsc && audioCtx && !isMuted) {
    const pitch = 50 + (speed - MIN_SPEED) * 18;
    engineOsc.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.1);
  }
}

function stopEngineSound() {
  if (engineOsc) {
    try { engineOsc.stop(); engineOsc.disconnect(); } catch(e){}
    engineOsc = null;
  }
}

function playScoreSound() {
  if (!audioCtx || isMuted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
  osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);

  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

function playCoinSound() {
  if (!audioCtx || isMuted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5
  osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08); // E6

  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

function playCountrySwitchSound() {
  if (!audioCtx || isMuted) return;
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major Fanfare
  notes.forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + idx * 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.2);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + idx * 0.08);
    osc.stop(audioCtx.currentTime + idx * 0.08 + 0.2);
  });
}

function playCrashSound() {
  if (!audioCtx || isMuted) return;
  const bufferSize = audioCtx.sampleRate * 0.4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);
  filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.4);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  noise.start();
}

/* =========================================================
   GAME STATE & LOGIC
   ========================================================= */
let plane, pipes, coinsList, score, totalCoinsCollected, best, gameRunning;
let worldSpeed;
let distanceSinceLastPipe;
let bannerTimer = 0;

const keys = { up: false, down: false, left: false, right: false };

function resetGame() {
  plane = { x: 90, y: H / 2, size: 22 };
  pipes = [];
  coinsList = [];
  score = 0;
  totalCoinsCollected = 0;
  currentCountryIndex = 0;
  gameRunning = false;
  worldSpeed = DEFAULT_SPEED;
  distanceSinceLastPipe = -SAFE_START_DISTANCE;
  bannerTimer = 120;
  best = Number(localStorage.getItem("geoFlyerBest") || 0);
  document.getElementById("coin-count").innerText = totalCoinsCollected;
  weatherSystem.init();
}

const RIDGE_X_FRACS = [0, 0.16, 0.34, 0.5, 0.66, 0.84, 1];

function makeRidge() {
  return [0, 0.35 + Math.random()*0.25, 0.55 + Math.random()*0.3, 1, 0.55 + Math.random()*0.3, 0.35 + Math.random()*0.25, 0];
}

function spawnPipe() {
  const margin = 60;
  const gapCenter = margin + Math.random() * (H - margin * 2 - PIPE_GAP);
  pipes.push({
    x: W,
    gapTop: gapCenter - PIPE_GAP / 2,
    gapBottom: gapCenter + PIPE_GAP / 2,
    passed: false,
    topRidge: makeRidge(),
    bottomRidge: makeRidge(),
    country: COUNTRIES[currentCountryIndex],
    treeSeed: Math.random()
  });

  // Spawn collectible coin inside gap
  if (Math.random() > 0.25) {
    coinsList.push({
      x: W + PIPE_WIDTH / 2,
      y: gapCenter + (Math.random() * 60 - 30),
      radius: 10,
      collected: false
    });
  }
}

function setKey(code, isDown) {
  switch (code) {
    case "ArrowUp": case "KeyW": keys.up = isDown; break;
    case "ArrowDown": case "KeyS": keys.down = isDown; break;
    case "KeyA": keys.left = isDown; break;
    case "KeyD": keys.right = isDown; break;
  }
}
document.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","KeyW","KeyS","KeyA","KeyD"].includes(e.code)) e.preventDefault();
  setKey(e.code, true);
});
document.addEventListener("keyup", (e) => setKey(e.code, false));

function bindTouch(id, keyName) {
  const el = document.getElementById(id);
  el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyName] = true; });
  el.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
}
bindTouch("btn-up", "up");
bindTouch("btn-down", "down");
bindTouch("btn-fast", "right");
bindTouch("btn-slow", "left");

function update() {
  if (keys.up) plane.y -= VERTICAL_SPEED;
  if (keys.down) plane.y += VERTICAL_SPEED;

  const halfSize = plane.size / 2;
  plane.y = Math.max(halfSize, Math.min(H - halfSize, plane.y));

  if (keys.left) worldSpeed = Math.max(MIN_SPEED, worldSpeed - SPEED_ACCEL);
  if (keys.right) worldSpeed = Math.min(MAX_SPEED, worldSpeed + SPEED_ACCEL);

  updateEnginePitch(worldSpeed);
  weatherSystem.update(worldSpeed);

  distanceSinceLastPipe += worldSpeed;
  if (distanceSinceLastPipe >= PIPE_SPACING) {
    spawnPipe();
    distanceSinceLastPipe = 0;
  }

  // Update Mountain Obstacles
  pipes.forEach(pipe => {
    pipe.x -= worldSpeed;

    if (!pipe.passed && pipe.x + PIPE_WIDTH < plane.x) {
      pipe.passed = true;
      score++;
      
      // EVERY 12 POINTS -> SWITCH COUNTRY!
      if (score > 0 && score % 12 === 0) {
        currentCountryIndex = (currentCountryIndex + 1) % COUNTRIES.length;
        bannerTimer = 120;
        playCountrySwitchSound();
      } else {
        playScoreSound();
      }
    }

    const withinX = plane.x + halfSize > pipe.x && plane.x - halfSize < pipe.x + PIPE_WIDTH;
    const hitsTop = plane.y - halfSize < pipe.gapTop;
    const hitsBottom = plane.y + halfSize > pipe.gapBottom;
    if (withinX && (hitsTop || hitsBottom)) endGame();
  });

  // Update Collectible Coins
  for (let i = coinsList.length - 1; i >= 0; i--) {
    let coin = coinsList[i];
    coin.x -= worldSpeed;

    // Check collision with plane
    const dx = plane.x - coin.x;
    const dy = plane.y - coin.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (!coin.collected && dist < halfSize + coin.radius) {
      coin.collected = true;
      totalCoinsCollected++;
      score++; // Coins grant +1 point
      document.getElementById("coin-count").innerText = totalCoinsCollected;
      playCoinSound();

      // Trigger country switch if coin hits point boundary
      if (score > 0 && score % 12 === 0) {
        currentCountryIndex = (currentCountryIndex + 1) % COUNTRIES.length;
        bannerTimer = 120;
        playCountrySwitchSound();
      }
    }

    if (coin.x < -30 || coin.collected) {
      coinsList.splice(i, 1);
    }
  }

  pipes = pipes.filter(p => p.x + PIPE_WIDTH > 0);
  if (bannerTimer > 0) bannerTimer--;
}

let cloudOffset = 0;

/* =========================================================
   COUNTRY-SPECIFIC MOUNTAIN & ATMOSPHERE RENDERER
   ========================================================= */
function drawMountain(pipe, isTop) {
  const theme = pipe.country;
  const baseY = isTop ? 0 : H;
  const tipY = isTop ? pipe.gapTop : pipe.gapBottom;
  const ridge = isTop ? pipe.topRidge : pipe.bottomRidge;

  const yAt = (hFrac) => baseY + (tipY - baseY) * hFrac;

  // Mountain Color Gradient based on Country Theme
  const grad = ctx.createLinearGradient(0, baseY, 0, tipY);
  grad.addColorStop(0, theme.base);
  grad.addColorStop(0.55, theme.mid);
  grad.addColorStop(1, theme.peak);

  ctx.beginPath();
  ctx.moveTo(pipe.x, baseY);
  RIDGE_X_FRACS.forEach((xf, i) => { ctx.lineTo(pipe.x + xf * PIPE_WIDTH, yAt(ridge[i])); });
  ctx.lineTo(pipe.x + PIPE_WIDTH, baseY);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Shading facets for 3D depth
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  for (let i = 1; i < RIDGE_X_FRACS.length; i++) {
    ctx.beginPath();
    ctx.moveTo(pipe.x + RIDGE_X_FRACS[i - 1] * PIPE_WIDTH, yAt(ridge[i - 1]));
    ctx.lineTo(pipe.x + RIDGE_X_FRACS[i] * PIPE_WIDTH, yAt(ridge[i]));
    ctx.lineTo(pipe.x + RIDGE_X_FRACS[i] * PIPE_WIDTH, baseY);
    ctx.lineTo(pipe.x + RIDGE_X_FRACS[i - 1] * PIPE_WIDTH, baseY);
    ctx.closePath();
    if (i % 2 === 0) ctx.fill();
  }

  // Snow Cap (Only if theme supports snow)
  if (theme.hasSnow && theme.snow) {
    const peakXf = RIDGE_X_FRACS[3];
    const peakX = pipe.x + peakXf * PIPE_WIDTH;
    const peakY = yAt(1);
    const capSpread = PIPE_WIDTH * 0.12;
    ctx.fillStyle = theme.snow;
    ctx.beginPath();
    ctx.moveTo(peakX, peakY);
    ctx.lineTo(peakX - capSpread, yAt(1) + (baseY - yAt(1)) * -0.05 + (isTop ? -8 : 8));
    ctx.lineTo(peakX + capSpread, yAt(1) + (isTop ? -8 : 8));
    ctx.closePath();
    ctx.fill();
  }

  // Base Foliage / Trees
  ctx.fillStyle = theme.tree;
  const treeCount = 3;
  for (let t = 0; t < treeCount; t++) {
    const seedVal = (pipe.treeSeed * 97 + t * 37) % 1;
    const tXf = 0.08 + seedVal * 0.2 + t * 0.28;
    const tX = pipe.x + tXf * PIPE_WIDTH;
    const tHeight = 12;
    const treeBaseY = baseY - (isTop ? -4 : 4);
    ctx.beginPath();
    ctx.moveTo(tX, treeBaseY - (isTop ? -tHeight : tHeight));
    ctx.lineTo(tX - 5, treeBaseY);
    ctx.lineTo(tX + 5, treeBaseY);
    ctx.closePath();
    ctx.fill();
  }
}

function drawCoins() {
  coinsList.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    
    // Golden Coin Body
    ctx.beginPath();
    ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#f1c40f";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#d35400";
    ctx.stroke();

    // Inner Coin Detail
    ctx.beginPath();
    ctx.arc(0, 0, c.radius * 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = "#f39c12";
    ctx.stroke();

    ctx.restore();
  });
}

function drawPlane() {
  ctx.save();
  ctx.translate(plane.x, plane.y);

  let angle = keys.up ? -0.3 : (keys.down ? 0.3 : 0);
  ctx.rotate(angle);

  const s = plane.size;

  // Vertical Tail Fin
  ctx.fillStyle = "#d64545";
  ctx.beginPath();
  ctx.moveTo(-s * 1.05, 0);
  ctx.lineTo(-s * 1.5, -s * 0.85);
  ctx.lineTo(-s * 0.75, -s * 0.15);
  ctx.closePath();
  ctx.fill();

  // Horizontal Stabilizer
  ctx.fillStyle = "#c94040";
  ctx.beginPath();
  ctx.moveTo(-s * 1.25, 0);
  ctx.lineTo(-s * 1.55, s * 0.32);
  ctx.lineTo(-s * 0.95, s * 0.14);
  ctx.closePath();
  ctx.fill();

  // Main Swept Wing
  ctx.fillStyle = "#e6e9ec";
  ctx.strokeStyle = "#aeb4ba";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, s * 0.08);
  ctx.lineTo(-s * 0.85, s * 0.85);
  ctx.lineTo(-s * 0.25, s * 0.85);
  ctx.lineTo(s * 0.4, s * 0.14);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Fuselage Body
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = "#1e3c72";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-s * 1.05, -s * 0.24);
  ctx.quadraticCurveTo(-s * 0.15, -s * 0.55, s * 0.85, -s * 0.17);
  ctx.quadraticCurveTo(s * 1.35, 0, s * 0.85, s * 0.17);
  ctx.quadraticCurveTo(-s * 0.15, s * 0.55, -s * 1.05, s * 0.24);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Red Nose Tip
  ctx.fillStyle = "#d64545";
  ctx.beginPath();
  ctx.moveTo(s * 0.85, -s * 0.17);
  ctx.quadraticCurveTo(s * 1.35, 0, s * 0.85, s * 0.17);
  ctx.lineTo(s * 0.68, 0);
  ctx.closePath();
  ctx.fill();

  // Cockpit Window
  ctx.fillStyle = "#28344d";
  ctx.beginPath();
  ctx.ellipse(s * 0.52, -s * 0.06, s * 0.24, s * 0.14, -0.15, 0, Math.PI * 2);
  ctx.fill();

  // Passenger Windows
  ctx.fillStyle = "#8fb8e8";
  for (let wx = -s * 0.75; wx <= s * 0.05; wx += s * 0.32) {
    ctx.beginPath();
    ctx.arc(wx, -s * 0.02, s * 0.07, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function draw() {
  const currentTheme = COUNTRIES[currentCountryIndex];

  // Dynamic Sky Background based on current country
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, currentTheme.sky[0]);
  skyGrad.addColorStop(0.7, currentTheme.sky[1]);
  skyGrad.addColorStop(1, currentTheme.sky[2]);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Cloud layer
  cloudOffset += worldSpeed * 0.15;
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  for (let i = 0; i < 4; i++) {
    const cx = (cloudOffset + i * 160) % (W + 100) - 50;
    ctx.beginPath();
    ctx.ellipse(cx, 80 + i * 40, 30, 14, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  pipes.forEach(pipe => {
    drawMountain(pipe, true);
    drawMountain(pipe, false);
  });

  drawCoins();
  weatherSystem.draw();
  drawPlane();

  // Score display
  ctx.fillStyle = "#fff";
  ctx.font = "bold 28px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(score, W / 2, 45);

  // Current Country HUD Indicator
  ctx.font = "bold 16px sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText(`${currentTheme.emoji} ${currentTheme.name.toUpperCase()}`, W / 2, 72);

  // Country Switch Announcement Banner
  if (bannerTimer > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(W / 2 - 140, 95, 280, 50);
    ctx.font = "bold 20px sans-serif";
    ctx.fillStyle = "#f1c40f";
    ctx.fillText(`Entering ${currentTheme.emoji} ${currentTheme.name}!`, W / 2, 127);
  }

  const pct = ((worldSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)) * 100;
  speedBar.style.width = pct + "%";
}

function loop() {
  if (gameRunning) {
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const overlayText = document.getElementById("overlay-text");
const startBtn = document.getElementById("start-btn");
const speedBar = document.getElementById("speed-bar");

function startGame() {
  initAudio();
  resetGame();
  gameRunning = true;
  overlay.style.display = "none";
  startEngineSound();
}

function endGame() {
  if (!gameRunning) return;
  gameRunning = false;
  stopEngineSound();
  playCrashSound();

  if (score > best) {
    best = score;
    localStorage.setItem("geoFlyerBest", String(best));
  }
  overlayTitle.textContent = "Crashed!";
  overlayText.innerHTML = `You scored <strong>${score}</strong> points.<br>Coins Collected: 🪙 <strong>${totalCoinsCollected}</strong><br>Best Score: ${best}`;
  startBtn.textContent = "Try Again";
  overlay.style.display = "flex";
}

startBtn.addEventListener("click", startGame);

resetGame();
draw();
loop();
</script>

</body>
